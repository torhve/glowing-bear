name: 'Deploy Pages'

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: 'Build the site'
        uses: ./.github/workflows/_build-web.yml
        with:
            # The Pages site lives at github.io/glowing-bear, so this is the one
            # build that is not built for the root of an origin. Kit bakes the
            # address in: a zip built for another address cannot serve here.
            base_path: '/glowing-bear'
            pages_artifact: true

    deploy:
        name: 'Deploy to GitHub Pages'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 10
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
