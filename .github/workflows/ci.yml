name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit
        run: |
          mkdir -p src-svelte/.svelte-kit
          echo '{"compilerOptions":{}}' > src-svelte/.svelte-kit/tsconfig.json
          npx svelte-kit sync

      - name: Svelte check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: WeeChat format library tests
        run: npm run test:weechat-format

      - name: Build
        run: npm run build

      # The release workflow packages this same build. Packaging here too means a
      # broken packager fails the push that broke it, not the release that needs it.
      - name: Package the web release artifact
        run: npm run package:web

      - name: Check the artifact checksum
        run: ( cd dist && sha256sum -c SHA256SUMS )
